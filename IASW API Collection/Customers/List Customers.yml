info:
  name: List Customers
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/customers?page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: search
      value: John
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: List all customers with pagination. Optionally search by name or account number.
