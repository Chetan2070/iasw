info:
  name: Get Request Stats
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/requests/stats/summary"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get summary statistics for all requests.

  Returns: total, pending, approved, rejected
