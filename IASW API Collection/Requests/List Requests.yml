info:
  name: List Requests
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/requests?page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: customer_id
      value: CUST001
      type: query
      disabled: true
    - name: change_type
      value: LEGAL_NAME
      type: query
      disabled: true
    - name: status
      value: AI_VERIFIED_PENDING_HUMAN
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List requests with optional filters.

  Filters: customer_id, change_type, status
  Pagination: page (default: 1), limit (default: 20, max: 100)
