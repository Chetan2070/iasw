info:
  name: Get Current User
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/auth/me"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get current authenticated user's information.
