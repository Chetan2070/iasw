info:
  name: Create User (Admin)
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/auth/users"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "newuser",
        "email": "newuser@example.com",
        "password": "password123",
        "role": "staff",
        "checker_id": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Create a new user (admin only).

  Roles: staff, checker, admin
