info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "admin123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Authenticate user and return JWT tokens.

  Test Credentials:
  - admin / admin123 (admin role)
  - staff / staff123 (staff role)
  - chk-001 / checker123 (checker role)
