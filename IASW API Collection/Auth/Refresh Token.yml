info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Refresh access token using refresh token.
