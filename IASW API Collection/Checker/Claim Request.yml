info:
  name: Claim Request
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/checker/claim/REQ-XXXXXXXX?checker_id=chk-001"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: checker_id
      value: chk-001
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Claim a request for review. Checker has 15 minutes to complete review.
