info:
  name: Get Review History
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/checker/reviews?checker_id=chk-001&page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: checker_id
      value: chk-001
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get completed reviews for a specific checker.
