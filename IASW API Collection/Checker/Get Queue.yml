info:
  name: Get Queue
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/checker/queue?page=1&limit=20"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: risk_tier
      value: HIGH
      type: query
      disabled: true
    - name: ai_recommendation
      value: APPROVE
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get the queue of requests pending human review.

  Filters: risk_tier (LOW, MEDIUM, HIGH), ai_recommendation (APPROVE, REJECT, MANUAL_REVIEW)
